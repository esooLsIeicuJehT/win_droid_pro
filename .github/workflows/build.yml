name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: WinDroidPro
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test binary relocation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and check Android app
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain --stacktrace --max-workers=4
      - name: Verify packaged runtime
        run: python3 scripts/verify_runtime.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WinDroidPro-Debug
          path: WinDroidPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinDroidPro-Checks
          path: |
            WinDroidPro/app/build/reports/tests/
            WinDroidPro/app/build/reports/lint-results-debug.*
          retention-days: 30
